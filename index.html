{const cu=LS.get("sky_cur");let us=[];try{us=JSON.parse(LS.get("sky_users")||"[]")}catch(e){}if(cu&&(cu==="demo"||us.some(u=>u.id===cu)))KEY="sky_d_"+cu;else if(cu)LS.del("sky_cur")}

 s.ci=Object.keys(seen).sort().map(k=>seen[k]);
 const t2={};for(const k in(s.tasks||{})){const nk=dKey(k);if(nk)t2[nk]=s.tasks[k]}s.tasks=t2;
